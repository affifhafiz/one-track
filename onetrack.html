<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Site Hero Leaderboard</title>
    <style>
        :root {
            --bg: #f4f5f9;
            --card: #fff;
            --tx: #1b1f2a;
            --mu: #6b7280;
            --pr: #e31837;
            --ac: #ffd500;
            --ok: #16a34a;
            --bad: #dc2626;
            --bd: #e3e5ec;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #12141c;
                --card: #1c1f2b;
                --tx: #eef0f6;
                --mu: #9aa1b2;
                --pr: #ff596d;
                --bd: #2c3040
            }
        }

        :root[data-theme="dark"] {
            --bg: #12141c;
            --card: #1c1f2b;
            --tx: #eef0f6;
            --mu: #9aa1b2;
            --pr: #ff596d;
            --bd: #2c3040
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        header {
            background: var(--pr);
            color: #fff;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        header h1 {
            font-size: 17px;
            margin: 0
        }

        header small {
            opacity: .8
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 12px
        }

        nav {
            display: flex;
            gap: 6px;
            margin-bottom: 12px
        }

        nav button,
        .pill {
            flex: 1;
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            padding: 10px 6px;
            border-radius: 10px;
            font: inherit;
            cursor: pointer
        }

        nav button.on,
        .pill.on {
            background: var(--pr);
            color: #fff;
            border-color: var(--pr)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .rank {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bd);
            display: grid;
            place-items: center;
            font-weight: 700;
            flex: none
        }

        .r1 {
            background: var(--ac);
            color: #000
        }

        .grow {
            flex: 1;
            min-width: 0
        }

        .bar {
            height: 8px;
            background: var(--bd);
            border-radius: 6px;
            overflow: hidden;
            margin: 6px 0 4px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--pr)
        }

        .tot {
            font-weight: 700;
            font-size: 18px;
            text-align: right
        }

        .mu {
            color: var(--mu);
            font-size: 13px
        }

        .ok {
            color: var(--ok)
        }

        .bad {
            color: var(--bad)
        }

        .chips span {
            display: inline-block;
            font-size: 12px;
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 1px 8px;
            margin: 2px 4px 0 0
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 12px
        }

        .pills .pill {
            flex: none;
            padding: 8px 12px
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            place-items: center;
            padding: 20px;
            z-index: 9
        }

        .ov .card {
            width: 100%;
            max-width: 320px;
            margin: 0
        }

        input[type=number],
        input[type=password] {
            width: 100%;
            font: inherit;
            font-size: 20px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx)
        }

        .go {
            width: 100%;
            margin-top: 10px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer
        }

        .del {
            border: 0;
            background: none;
            color: var(--bad);
            cursor: pointer;
            font-size: 16px
        }

        .tgt {
            width: 90px !important;
            font-size: 15px !important;
            padding: 6px !important
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: #16a34a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            display: none
        }

        body.tv header,
        body.tv nav,
        body.tv .hide-tv {
            display: none
        }

        body.tv main {
            max-width: none;
            padding: 20px
        }

        body.tv .card {
            font-size: 22px;
            padding: 18px
        }

        .tvx {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top, 0px));
            right: 10px;
            display: none
        }

        body.tv .tvx {
            display: block
        }

        label.sw {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px
        }
    </style>
</head>

<body>
    <header>
        <div>
            
            <h1><img src="shell-logo.png" alt="Shell Malaysia logo" style="height: 40px; margin-right: 5px;">Site Hero OneTrack Leaderboard</h1><small id="mon">
        </div>
    </header>
    <button class="pill tvx" id="tvx">Exit TV</button>
    <main>
        <nav class="hide-tv"><button data-t="lb" class="on">🏆 Board</button><button data-t="add">➕ Add</button><button
                data-t="mg">⚙️ Manage</button></nav>
        <div id="sync-status" class="mu" role="status" style="text-align:center;margin:8px 0"></div>
        <div id="v"></div>
    </main>
    <div class="ov" id="pin">
        <div class="card"><b>Manager PIN</b><input type="password" id="pinin" inputmode="numeric" autocomplete="off"
                style="margin-top:8px"><button class="go" id="pinok">Enter</button><button class="pill" id="pinx"
                style="width:100%;margin-top:8px">Cancel</button></div>
    </div>
    <div class="toast" id="toast">Saved ✓</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        var SHEET_URL = "https://script.google.com/macros/s/AKfycbzU_wQq068U8JMhkvONSCkXnuwJU4xyeNwjaXjbYWOK7E9d-fhbRskXmCuTUQ2Q0mzG/exec";
        var PIN = "";
        function api(b) {
            return fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(b) })
                .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json() })
                .then(function (d) {
                    if (d.ok !== true) throw new Error(d.error == "pin" ? "Wrong PIN" : "Sheet rejected change");
                    return d;
                });
        }
        function checkPin(p) {
            return api({ action: "check", pin: p })
                .then(function (d) { return d.ok === true })
                .catch(function (e) {
                    if (e.message == "Wrong PIN") return false;
                    throw e;
                });
        }
        var syncState = "loading";
        function setSyncStatus(message) { document.getElementById("sync-status").textContent = message }
        function pull() {
            var hasLiveData = syncState == "ready";
            if (!hasLiveData) { syncState = "loading"; draw() }
            setSyncStatus(hasLiveData ? "Refreshing" : "");
            return fetch(SHEET_URL).then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            }).then(function (d) {
                if (!d || !Array.isArray(d.entries) || !d.targets || typeof d.targets != "object") throw new Error("Unexpected response");
                db.entries = d.entries; db.targets = d.targets; db.heroes = Object.keys(d.targets);
                syncState = "ready"; setSyncStatus(""); draw();
            }).catch(function (e) {
                syncState = "error"; setSyncStatus("" + e.message); draw();
            });
        }
        var HEROES = ["Ira", "Irwan", "Wina", "Anas KG", "Fareez", "Mika", "Nasri", "Man", "Affif"];
        var TASKS = ["Kombo", "End Cap", "Lub", "Shell Apps", "CR Sales", "Deli2Go"];
        var now = new Date(), MK = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
        document.getElementById("mon").textContent = now.toLocaleString("en", { month: "long", year: "numeric" });
        var db = { entries: [], targets: {}, heroes: [] }, pendingRm = "", tab = "lb", mgr = false, selH = HEROES[0], selT = TASKS[0], last = "";
        function sums() { var r = {}; db.heroes.forEach(function (h) { r[h] = { total: 0, by: {} } }); db.entries.forEach(function (e) { if (e.date.indexOf(MK) == 0 && r[e.hero]) { r[e.hero].total += e.amount; r[e.hero].by[e.task] = (r[e.hero].by[e.task] || 0) + e.amount } }); return r }
        function pills(list, sel, k) { return '<div class="pills">' + list.map(function (x) { return '<button class="pill' + (x == sel ? ' on' : '') + '" data-' + k + '="' + x + '">' + x + '</button>' }).join("") + '</div>' }
        function board() {
            var s = sums(), list = db.heroes.slice().sort(function (a, b) { return s[b].total - s[a].total });
            return list.map(function (h, i) {
                var t = db.targets[h] || 0, p = t ? Math.min(100, s[h].total / t * 100) : 0, diff = s[h].total - t;
                var ch = Object.keys(s[h].by).map(function (k) { return '<span>' + k + ' ' + s[h].by[k] + '</span>' }).join("");
                return '<div class="card"><div class="row"><div class="rank' + (i == 0 ? ' r1' : '') + '">' + (i + 1) + '</div><div class="grow"><b>' + h + '</b><div class="bar"><i style="width:' + p + '%"></i></div><div class="mu">Target ' + t + ' · <span class="' + (diff >= 0 ? 'ok' : 'bad') + '">' + (diff >= 0 ? '+' : '') + diff + '</span></div></div><div class="tot">' + s[h].total + '</div></div><div class="chips">' + ch + '</div></div>'
            }).join("") + '<button class="pill hide-tv" id="tv" style="width:100%">📺 TV mode</button>';
        }
        function recent(del) { return db.entries.slice().reverse().slice(0, 8).map(function (e) { return '<div class="row" style="padding:6px 0;border-top:1px solid var(--bd)"><div class="grow">' + e.hero + ' · ' + e.task + ' <span class="mu">' + e.date.slice(5) + '</span></div><b>' + e.amount + '</b>' + (del ? '<button class="del" data-del="' + e.id + '">✕</button>' : '') + '</div>' }).join("") }
        var pinCb = null;
        function askPin(cb) { var i = document.getElementById("pinin"); i.value = ""; document.getElementById("pin").style.display = "grid"; i.focus(); pinCb = cb }
        function hidePin() { document.getElementById("pin").style.display = "none" }
        function submitPin() {
            var p = document.getElementById("pinin").value, cb = pinCb;
            hidePin(); pinCb = null;
            if (!p || !cb) return;
            checkPin(p).then(function (ok) {
                if (ok) { PIN = p; mgr = true; cb() }
                else toast("Wrong PIN");
            }).catch(function (e) { toast("Can't verify PIN: " + e.message) });
        }
        document.addEventListener("keydown", function (e) { if (e.key == "Enter" && e.target.id == "pinin") submitPin() });
        function exportXlsx() {
            if (!window.XLSX) { toast("Excel library not loaded"); return }
            var s = sums(), rows = [["Hero"].concat(TASKS, ["Total", "Target", "+/-"])].concat(db.heroes.map(function (h) { var t = db.targets[h] || 0; return [h].concat(TASKS.map(function (k) { return s[h].by[k] || 0 }), [s[h].total, t, s[h].total - t]) }));
            var er = [["Date", "Hero", "Task", "Amount"]].concat(db.entries.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1 }).map(function (e) { return [e.date, e.hero, e.task, e.amount] }));
            var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Summary " + MK); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(er), "All entries");
            var name = "site-hero-" + MK + ".xlsx", blob = new Blob([XLSX.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            var c = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
            c.then(function (dl) {
                if (dl) { return dl.save({ filename: name, data: blob }).then(function () { toast("Exported") }).catch(function (e) { if (!e || e.code != "declined") toast("Export failed") }) }
                var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Exported")
            })
        }
        function goTab(t) {
            if (t == "mg") {
                if (mgr) { tab = t; draw(); return }
                askPin(function () { tab = "mg"; draw() });
                return;
            }
            mgr = false; PIN = ""; pendingRm = ""; tab = t; draw();
        }
        function add() {
            if (db.heroes.indexOf(selH) < 0) selH = db.heroes[0];
            var rec = recent(false);
            return '<div class="card"><b>Who?</b>' + pills(db.heroes, selH, "h") + '<b>Task</b>' + pills(TASKS, selT, "k") + '<b>Amount</b><input type="number" id="amt" inputmode="decimal" placeholder="e.g. 20"><button class="go" id="sub">Add entry</button></div><div class="card"><b>Recent</b>' + rec + '</div>';
        }
        function manage() {
            if (!mgr) return '<div class="card mu">🔒 Locked. Tap Manage and enter the PIN.</div>';
            return '<div class="card"><b></b><div class="mu">Live connection is configured for this app.</div></div><div class="card"><b>Recent entries</b>' + recent(true) + '</div><div class="card"><b>Staff & monthly targets</b>' + db.heroes.map(function (h) { return '<div class="row" style="padding:6px 0;border-top:1px solid var(--bd)"><div class="grow">' + h + '</div><input class="tgt" type="number" data-tg="' + h + '" value="' + (db.targets[h] || 0) + '"><button class="del" data-rm="' + h + '">' + (pendingRm == h ? "Sure?" : "✕") + '</button></div>' }).join("") + '<div class="row" style="margin-top:10px;gap:6px"><input type="text" id="newh" placeholder="New staff name" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)"><input class="tgt" type="number" id="newt" placeholder="Target" value="1050"></div><button class="go" id="addh" style="margin-top:8px">Add staff</button></div><div class="card"><b>Export</b><div class="mu">All entries plus this month\'s summary, as an Excel file.</div><button class="go" id="xl">📊 Export to Excel</button></div>';
        }
        function draw() {
            document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.t == tab) });
            if (syncState != "ready") {
                document.getElementById("v").innerHTML = '<div class="card">' + (syncState == "loading" ? "Loading live data..." : 'Unable to load live data. <button class="go" id="retry">Retry</button>') + '</div>';
                return;
            }
            document.getElementById("v").innerHTML = tab == "lb" ? board() : tab == "add" ? add() : manage();
        }
        function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(function () { t.style.display = "none" }, 1400) }
        document.addEventListener("click", function (ev) {
            var t = ev.target, d = t.dataset || {};
            if (d.t) { goTab(d.t) }
            else if (t.id == "pinok") { submitPin() }
            else if (t.id == "pinx") { hidePin(); pinCb = null }
            else if (t.id == "retry") { pull() }
            else if (t.id == "addh") {
                var nm = document.getElementById("newh").value.replace(/[<>"'&]/g, "").trim(), tg = parseFloat(document.getElementById("newt").value) || 0;
                if (!nm || db.heroes.indexOf(nm) >= 0) { toast("Name empty or already added"); return }
                api({ action: "addHero", hero: nm, target: tg, pin: PIN }).then(function () {
                    db.heroes.push(nm); db.targets[nm] = tg; draw(); toast("Added " + nm);
                }).catch(function (e) { toast("Couldn't add staff: " + e.message) });
            }
            else if (d.rm) {
                if (pendingRm == d.rm) {
                    api({ action: "removeHero", hero: d.rm, pin: PIN }).then(function () {
                        db.heroes = db.heroes.filter(function (h) { return h != d.rm });
                        delete db.targets[d.rm]; pendingRm = ""; draw(); toast("Staff removed");
                    }).catch(function (e) { toast("Couldn't remove staff: " + e.message) });
                } else { pendingRm = d.rm; draw() }
            }
            else if (t.id == "xl") { exportXlsx() }
            else if (d.h) { selH = d.h; var a = document.getElementById("amt").value; draw(); document.getElementById("amt").value = a }
            else if (d.del) {
                api({ action: "delete", id: d.del, pin: PIN }).then(function () {
                    db.entries = db.entries.filter(function (e) { return e.id != d.del }); draw(); toast("Entry deleted");
                }).catch(function (e) { toast("Couldn't delete entry: " + e.message) });
            }
            else if (t.id == "sub") {
                var v = parseFloat(document.getElementById("amt").value); if (!(v > 0)) { toast("Enter an amount"); return }
                var en = { id: "w" + Date.now(), date: MK + "-" + String(now.getDate()).padStart(2, "0"), hero: selH, task: selT, amount: v };
                api({ action: "add", date: en.date, hero: en.hero, task: en.task, amount: en.amount, id: en.id }).then(function () {
                    db.entries.push(en); draw(); toast("Saved ✓");
                }).catch(function (e) { toast("Couldn't save entry: " + e.message) });
            }
            else if (t.id == "tv") { document.body.classList.add("tv"); tab = "lb"; draw() }
            else if (t.id == "tvx") { document.body.classList.remove("tv") }

        });
        document.addEventListener("click", function (ev) { var k = ev.target.getAttribute && ev.target.getAttribute("data-k"); if (k) { selT = k; var a = document.getElementById("amt").value; draw(); document.getElementById("amt").value = a } });
        document.addEventListener("change", function (ev) {
            var t = ev.target;
            if (t.dataset.tg) {
                var hero = t.dataset.tg, oldTarget = db.targets[hero], target = parseFloat(t.value) || 0;
                api({ action: "target", hero: hero, target: target, pin: PIN }).then(function () {
                    db.targets[hero] = target; toast("Target saved");
                }).catch(function (e) {
                    t.value = oldTarget; toast("Couldn't save target: " + e.message);
                });
            }
        });
        setInterval(function () { if (tab == "lb") pull() }, 30000);
        draw(); pull();
    </script>
</body>

</html>
